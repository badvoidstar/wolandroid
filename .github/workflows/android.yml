name: Android build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo "SIGNING_MODE=development" >> "$GITHUB_ENV"
            echo "::warning::Using an ephemeral development key. Configure signing secrets for upgradeable releases."
          elif [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set all four ANDROID signing secrets, or none of them."
            exit 1
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wolandroid-release.jks"
            printf 'WOL_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/wolandroid-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and package
        env:
          WOL_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          WOL_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          WOL_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon --continue --stacktrace :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Show lint diagnostics
        if: always()
        shell: bash
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if [[ -f "$report" ]]; then
            cat "$report"
          fi
      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk
      - name: Prepare main download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WOLAndroid-${VERSION_NAME}.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS)
          printf 'WOLAndroid %s\n\nAndroid 8.0+ (API 26). Download the APK below and allow installation from your browser.\n\n' "$VERSION_NAME" > dist/RELEASE_NOTES.txt
          if [[ "$SIGNING_MODE" == "development" ]]; then
            printf 'DEVELOPMENT-SIGNED BUILD: This APK is installable but uses a temporary signing key. Upgrades from another build may require uninstalling the old app, deleting its saved devices and invalidating shortcuts. Configure the four signing secrets documented in README.md for a stable private release key.\n\n' >> dist/RELEASE_NOTES.txt
          else
            printf 'Signed with the repository-configured private release key.\n\n' >> dist/RELEASE_NOTES.txt
          fi
          printf 'Discovery cannot reveal every device or MAC address on modern Android. See README.md and in-app help for DNS, VPN and WOL prerequisites.\n\nSource commit: %s\n' "$GITHUB_SHA" >> dist/RELEASE_NOTES.txt
      - name: Retain main APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: WOLAndroid-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary private keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/wolandroid-release.jks"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: WOLAndroid-1.0.${{ github.run_number }}
          path: dist
      - name: Publish installable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.0.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file dist/RELEASE_NOTES.txt
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS \
              --target "$GITHUB_SHA" --title "WOLAndroid ${TAG#v}" \
              --notes-file dist/RELEASE_NOTES.txt --latest
          fi
